<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Плеер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-container">
        <header class="player-header">
            <div class="header-top">
                <h1>🎬 HLS Stream Player</h1>
                <button class="share-btn" id="shareBtn" title="Поделиться ссылкой на поток">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="18" cy="5" r="3"/>
                        <circle cx="6" cy="12" r="3"/>
                        <circle cx="18" cy="19" r="3"/>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                    </svg>
                    Поделиться
                </button>
            </div>
            
            <div class="url-input-group">
                <input 
                    type="text" 
                    class="url-input" 
                    placeholder="Вставьте ссылку на .m3u8 поток..."
                    id="urlInput"
                    autocomplete="off"
                >
                <button class="load-btn" id="loadBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5,3 19,12 5,21"/>
                    </svg>
                    Play
                </button>
            </div>

            <div class="test-streams">
                <span class="test-streams-label">Тестовые потоки:</span>
                <button class="test-stream-btn" data-url="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">
                    Mux Test
                </button>
                <button class="test-stream-btn" data-url="https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8">
                    Apple BipBop
                </button>
            </div>
        </header>
        
        <div class="video-wrapper">
            <video id="video" controls playsinline></video>
        </div>
        
        <footer class="status-bar">
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Ожидание потока</span>
            </div>
            <span id="streamInfo"></span>
        </footer>
    </div>
    
    <div class="copy-notification" id="copyNotification">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
        Ссылка скопирована!
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="script.js"></script>
</body>
</html>
